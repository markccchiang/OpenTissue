name: CI

on:
  # Every branch, not just the default one. Restricting this to master/main meant a feature
  # branch could be pushed and reviewed with no CI at all, which is exactly when it is most
  # wanted. Tags are excluded: '**' matches branch names only.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux / Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS / AppleClang
            os: macos-14
          - name: Windows / MSVC
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Dependencies.
      #
      # Boost is the only hard requirement. Qhull and libpng are optional: when
      # they are missing the affected headers and tests are skipped rather than
      # failing the build, but CI installs them so that everything is covered.
      # TinyXML is not installed anywhere, on purpose, so that the FetchContent
      # fallback in cmake/OpenTissueDependencies.cmake is exercised on every run.
      #
      # The GL stack is needed even for jobs that never open a window. gl.h
      # includes <GL/glew.h>, and it is reached from more than the graphics
      # library: gpu/image/image.h pulls in the GL Texture2D class, so even the
      # PNG test needs it, and the header self-containment check compiles every
      # GL helper in the tree.
      # ---------------------------------------------------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-dev libboost-test-dev \
            libqhull-dev libpng-dev libeigen3-dev \
            libglew-dev libglfw3-dev freeglut3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # OpenGL and GLUT are system frameworks on macOS; GLEW and GLFW are not.
        run: brew install boost qhull libpng glew glfw eigen

      # vcpkg keeps its built packages in the GitHub Actions cache, so once a run has
      # succeeded later runs restore them instead of rebuilding ~60 packages from source.
      - name: Enable vcpkg binary caching
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        # boost-test alone is not enough: OpenTissue uses these Boost components
        # throughout, and vcpkg ports them separately. The list is derived from the
        # boost/ includes actually present in the tree.
        #
        # Retried, because this is the least reliable step in the workflow. The Boost
        # components pull in roughly sixty transitive packages, each fetched as a source
        # archive from github.com, and a single HTTP 504 from there aborts the whole
        # install. That happened on two consecutive runs. vcpkg already retries an
        # individual download three times; this retries the install as a whole, and with
        # binary caching on, an attempt after a partial success has less left to do.
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        run: |
          for attempt in 1 2 3; do
            echo "::group::vcpkg install (attempt $attempt of 3)"
            if vcpkg install --triplet x64-windows \
                 boost-algorithm boost-array boost-conversion boost-iterator \
                 boost-lexical-cast boost-multi-array boost-numeric-conversion \
                 boost-interval boost-optional boost-property-map boost-random \
                 boost-test boost-type-traits boost-ublas boost-utility \
                 qhull libpng glew glfw3 freeglut eigen3
            then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed; waiting before retrying"
            sleep 30
          done
          echo "vcpkg install failed after 3 attempts"
          exit 1
        shell: bash

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          TOOLCHAIN=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            TOOLCHAIN="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOPENTISSUE_ENABLE_UNIT_TESTS=ON \
            -DOPENTISSUE_ENABLE_HEADER_TESTS=ON \
            $TOOLCHAIN

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      # Compiles every header on its own. See unit_tests/headers/.
      - name: Header self-containment
        run: cmake --build build --config Debug --target opentissue_header_check --parallel 4

      # The gating run. unit_kmeans and unit_bfgs carry the 'unreliable' label and
      # are excluded here; see unit_tests/CMakeLists.txt for why.
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure -LE unreliable

      # Reported, never gating, so the known-unreliable tests stay visible.
      - name: Test (known unreliable, informational)
        if: always()
        continue-on-error: true
        run: ctest --test-dir build --build-config Debug --output-on-failure -L unreliable

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-dev libboost-test-dev \
            libqhull-dev libpng-dev libeigen3-dev \
            libglew-dev libglfw3-dev freeglut3-dev \
            gcovr

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOPENTISSUE_ENABLE_UNIT_TESTS=ON \
            -DOPENTISSUE_ENABLE_CODE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE unreliable

      - name: Report
        run: |
          gcovr --root . --filter 'OpenTissue/' \
                --xml-pretty --output build/coverage.xml \
                --html-details build/coverage.html \
                --print-summary

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage.xml
            build/coverage*.html
